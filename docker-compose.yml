services:
  postgres:
    image: postgres:16-alpine
    container_name: dmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dmb}
      POSTGRES_USER: ${POSTGRES_USER:-dmb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?can dat POSTGRES_PASSWORD trong .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dmb} -d ${POSTGRES_DB:-dmb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Khong publish port ra ngoai. Muon ket noi tu may khac thi mo dong duoi:
    # ports:
    #   - "127.0.0.1:5432:5432"

  monitor:
    build: .
    container_name: dmb-monitor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # Exception list mount read-write de sua truc tiep khong can rebuild image
      - ./data/Exception_list.txt:/app/data/Exception_list.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: dmb-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?can dat GRAFANA_ADMIN_PASSWORD trong .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Dung cho file provisioning datasource
      DMB_DB_HOST: postgres:5432
      DMB_DB_NAME: ${POSTGRES_DB:-dmb}
      DMB_DB_USER: ${POSTGRES_USER:-dmb}
      DMB_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  grafana-data:
